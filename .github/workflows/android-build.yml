# Builds the signed Android App Bundle (.aab) for Google Play on GitHub's servers.
# Runs on every push that changes the app, or by hand: Actions → "Build Android app" → Run workflow.
# Download the result: repo home page → Releases → newest (the .aab), or the run page → Artifacts (the key, first build only).
name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['apps/mobile/**', 'packages/shared/**', '.github/workflows/android-build.yml']

permissions:
  contents: write   # to publish the .aab as a GitHub Release

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    env:
      # Public by design (protected by row-level security in the database).
      EXPO_PUBLIC_SUPABASE_URL: https://agtkwvwaznlkecyjvhkr.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_MHwfk1Ile0kr5fNW0ct7pA_TOTSJwuh
      EXPO_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://YOUR-DOMAIN.com' }}
      NODE_ENV: production
      CI: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install
        run: npm ci

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Set version code
        run: sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle

      # Upload key. Uses your saved key if you added the secrets; otherwise makes one
      # (first build only) and includes it in the download so you can save it.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "STORE_PASS=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "Using the saved upload key."
          elif [ "${{ vars.ALLOW_NEW_KEY }}" != "true" ]; then
            [ -z "$KEYSTORE_B64" ] && echo "::error::Missing repository secret ANDROID_KEYSTORE_BASE64 (Settings → Secrets and variables → Actions → Secrets tab → Repository secrets)."
            [ -z "$KEYSTORE_PASSWORD" ] && echo "::error::Missing repository secret ANDROID_KEYSTORE_PASSWORD (Settings → Secrets and variables → Actions → Secrets tab → Repository secrets)."
            echo "::error::Stopped instead of making a new key: Google Play already expects a specific upload key. Add the two secrets, then run this again."
            exit 1
          else
            PASS=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)
            keytool -genkeypair -v -storetype PKCS12 -keystore "$RUNNER_TEMP/upload.jks" -alias upload \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=Vouched, O=Vouched, C=US"
            echo "::add-mask::$PASS"
            echo "STORE_PASS=$PASS" >> "$GITHUB_ENV"
            cp "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/out/upload-key.jks"
            base64 -w0 "$RUNNER_TEMP/upload.jks" > "$RUNNER_TEMP/out/ANDROID_KEYSTORE_BASE64.txt"
            printf '%s' "$PASS" > "$RUNNER_TEMP/out/ANDROID_KEYSTORE_PASSWORD.txt"
            cat > "$RUNNER_TEMP/out/SAVE-THIS-KEY.txt" <<'TXT'
          This build made a NEW upload key. Google Play will expect this same key for every update.
          1. Save upload-key.jks and both .txt files somewhere safe (not in the repo).
          2. On GitHub: Settings → Secrets and variables → Actions → New repository secret
               ANDROID_KEYSTORE_BASE64   = contents of ANDROID_KEYSTORE_BASE64.txt
               ANDROID_KEYSTORE_PASSWORD = contents of ANDROID_KEYSTORE_PASSWORD.txt
          3. Delete this download from the run page (Artifacts → trash icon).
          Every build after that signs with the same key automatically.
          TXT
            echo "::warning::Made a new upload key. Save it from the artifact and add the two secrets (see SAVE-THIS-KEY.txt)."
          fi

      # Certificate + fingerprint, for Play Console (App integrity → upload key) if a key ever needs resetting.
      - name: Export upload certificate
        run: |
          keytool -export -rfc -keystore "$RUNNER_TEMP/upload.jks" -alias upload -storepass "$STORE_PASS" -file "$RUNNER_TEMP/out/upload_certificate.pem"
          SHA1=$(keytool -list -v -keystore "$RUNNER_TEMP/upload.jks" -alias upload -storepass "$STORE_PASS" | grep -m1 'SHA1:' | sed 's/.*SHA1: //')
          echo "UPLOAD_SHA1=$SHA1" >> "$GITHUB_ENV"
          echo "Upload key SHA1: $SHA1"

      - name: Build the app bundle
        working-directory: apps/mobile/android
        run: |
          ./gradlew bundleRelease --no-daemon -Dorg.gradle.jvmargs=-Xmx6g \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="$STORE_PASS" \
            -Pandroid.injected.signing.key.alias=upload \
            -Pandroid.injected.signing.key.password="$STORE_PASS"
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/out/vouched-${{ github.run_number }}.aab"

      # The signing key (if one was just made) is only in this private-ish download, never in the Release.
      - uses: actions/upload-artifact@v4
        with:
          name: vouched-android
          path: ${{ runner.temp }}/out/
          retention-days: 7

      # The .aab itself, easy to find: repo home page → Releases (right side) → newest.
      - name: Publish the .aab as a release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-${{ github.run_number }}" "$RUNNER_TEMP/out/vouched-${{ github.run_number }}.aab" \
            --title "Android build ${{ github.run_number }}" \
            --notes "Upload vouched-${{ github.run_number }}.aab to Google Play Console. Upload key SHA1: $UPLOAD_SHA1. If this build made a new signing key, download it from the Actions run (Artifacts → vouched-android) and save it." \
            --latest
